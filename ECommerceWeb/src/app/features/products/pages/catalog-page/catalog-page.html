<section class="catalog-page">
  <div class="catalog-page__header">
    <div>
      <p class="catalog-page__eyebrow">Catalog</p>
      <h1>Products</h1>
    </div>
  </div>

  <div>
    @for (product of products(); track product.id) {
      <p>
        {{ product.name }}
        — {{ product.price }} — Stock: {{ product.stock }}
      </p>
    }
  </div>
</section>
