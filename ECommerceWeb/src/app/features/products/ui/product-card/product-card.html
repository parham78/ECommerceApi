<article class="product-card">
  <app-product-image [productName]="product().name" />

  <div class="product-card__content">
    <p class="product-card__sku">
      {{ product().sku }}
    </p>

    <h2 class="product-card__name">
      {{ product().name }}
    </h2>

    <p class="product-card__price">{{ product().price }} CAD</p>

    <p class="product-card__stock">
      @if (product().stock > 0) {
        In stock · {{ product().stock }} available
      } @else {
        Out of stock
      }
    </p>
  </div>
</article>
