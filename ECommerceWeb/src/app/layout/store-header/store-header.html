<header class="store-header">
  <div class="store-header__inner">
    <a class="store-header__brand" routerLink="/products"> Supply </a>

    <div class="store-header__account">
      @if (authSession.isAuthenticated()) {
        @if (authSession.roles().includes('Customer')) {
          <a class="store-header__action" routerLink="/basket"> Basket </a>
        }

        <span class="store-header__email">
          {{ authSession.email() }}
        </span>

        <button type="button" class="store-header__action" (click)="signOut()">Sign out</button>
      } @else {
        <a class="store-header__action" routerLink="/login"> Sign in </a>
      }
    </div>
  </div>
</header>
